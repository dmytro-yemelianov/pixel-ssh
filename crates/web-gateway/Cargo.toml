[package]
name = "pixel-ssh-web-gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WebSocket to SSH anonymous gateway"

[[bin]]
name = "pixel-ssh-web-gateway"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
log = "0.4"
env_logger = "0.11"
