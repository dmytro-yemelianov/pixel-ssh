name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo check -p pixel-ssh-web-client --target wasm32-unknown-unknown --locked
      - run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - run: cargo build -p pixel-ssh-web-client --target wasm32-unknown-unknown --release --locked
      - run: wasm-bindgen target/wasm32-unknown-unknown/release/pixel_ssh_web_client.wasm --out-dir web/pkg --target web --no-typescript
      - run: git diff --exit-code -- web/pkg
