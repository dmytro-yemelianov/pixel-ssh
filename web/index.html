<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Interactive terminal · Dmytro Yemelianov</title>
  <meta name="description" content="Explore Dmytro Yemelianov's projects in an interactive pixel terminal." />
  <link rel="canonical" href="https://yemelianov.dev/terminal/" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="./screen.css" />
</head>
<body>
  <main id="screen-shell">
    <a class="accessible-link" href="/">Read the standard portfolio</a>
    <canvas id="screen" width="1280" height="800" role="img" aria-label="Interactive pixel portfolio. Press H for controls, P for projects, S to cycle systems, and V for visuals. The standard portfolio is available through the first keyboard link."></canvas>
  </main>

  <script type="module">
    import init from './pkg/pixel_ssh_web_client.js?v=screen-2';

    init({ module_or_path: './pkg/pixel_ssh_web_client_bg.wasm?v=screen-2' }).then(() => {
      const params = new URLSearchParams(window.location.search);
      const keys = params.get('keys');
      if (keys) {
        let delay = 150;
        for (const key of keys.split(',')) {
          setTimeout(() => {
            window.dispatchEvent(new KeyboardEvent('keydown', { key }));
          }, delay);
          delay += 150;
        }
      }

      const mouse = params.get('mouse');
      if (mouse) {
        const [mx, my] = mouse.split(',').map(Number);
        setTimeout(() => {
          const canvas = document.getElementById('screen');
          const rect = canvas.getBoundingClientRect();
          canvas.dispatchEvent(new PointerEvent('pointermove', {
            clientX: rect.left + (mx / 100) * rect.width,
            clientY: rect.top + (my / 100) * rect.height,
            bubbles: true
          }));
        }, 300);
      }
    }).catch(err => {
      console.error('WASM startup failure:', err);
      const message = document.createElement('pre');
      message.className = 'startup-error';
      message.textContent = `WebGL2/WASM initialization failed: ${err}`;
      document.body.replaceChildren(message);
    });
  </script>
</body>
</html>
