<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pixel-First Rust Web & SSH Interface</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body, html {
      background: #000;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas#screen {
      aspect-ratio: 4 / 3;
      width: min(100vw, calc(100vh * 4 / 3));
      height: min(100vh, calc(100vw * 3 / 4));
      max-width: 100vw;
      max-height: 100vh;
      object-fit: fill;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="screen" width="640" height="400"></canvas>
  <script type="module">
    import init from './pkg/pixel_ssh_web_client.js';
    init().catch(err => {
      console.error('WASM startup failure:', err);
      document.body.innerHTML = '<pre style="color:#f85149;padding:20px;">WebGL2/WASM initialization failed: ' + err + '</pre>';
    });
  </script>
</body>
</html>
