<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Pixel-First Rust Web & SSH Interface</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05070a;
    }
    #screen-shell {
      width: 100vw;
      height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, #0f141c 0%, #05070a 100%);
    }
    canvas#screen {
      display: block;
      width: min(100vw, calc(100dvh * 4 / 3));
      height: min(100dvh, calc(100vw * 3 / 4));
      aspect-ratio: 4 / 3;
      object-fit: fill;
      border-radius: 4px;
      box-shadow: 0 0 16px rgba(0, 0, 0, 0.9);
      touch-action: none;
      cursor: none;
    }
    @media (orientation: portrait) {
      canvas#screen { cursor: default; }
    }
  </style>
</head>
<body>
  <main id="screen-shell">
    <canvas id="screen" width="1280" height="800"></canvas>
  </main>

  <script type="module">
    import init from './pkg/pixel_ssh_web_client.js?v=screen-2';

    init({ module_or_path: './pkg/pixel_ssh_web_client_bg.wasm?v=screen-2' }).then(() => {
      const params = new URLSearchParams(window.location.search);
      const keys = params.get('keys');
      if (keys) {
        let delay = 150;
        for (const key of keys.split(',')) {
          setTimeout(() => {
            window.dispatchEvent(new KeyboardEvent('keydown', { key }));
          }, delay);
          delay += 150;
        }
      }

      const mouse = params.get('mouse');
      if (mouse) {
        const [mx, my] = mouse.split(',').map(Number);
        setTimeout(() => {
          const canvas = document.getElementById('screen');
          const rect = canvas.getBoundingClientRect();
          canvas.dispatchEvent(new PointerEvent('pointermove', {
            clientX: rect.left + (mx / 100) * rect.width,
            clientY: rect.top + (my / 100) * rect.height,
            bubbles: true
          }));
        }, 300);
      }
    }).catch(err => {
      console.error('WASM startup failure:', err);
      const message = document.createElement('pre');
      message.style.cssText = 'color:#f85149;padding:20px;';
      message.textContent = `WebGL2/WASM initialization failed: ${err}`;
      document.body.replaceChildren(message);
    });
  </script>
</body>
</html>
